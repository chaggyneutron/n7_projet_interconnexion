version: '3.8'

services:
  internet-router:
    image: frrouting/frr:latest
    container_name: internet-router
    hostname: internet-router
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    networks:
      as5-internet:
        ipv4_address: 120.0.81.2
      internet-backbone:
        ipv4_address: 10.0.0.1
      site-secondaire:
        ipv4_address: 10.0.1.1
    volumes:
      - ./config/internet-router.conf:/etc/frr/frr.conf:ro
      - ./config/daemons:/etc/frr/daemons:ro
    command: /bin/sh -c "chown frr:frr /etc/frr/daemons || true && /usr/lib/frr/docker-start"
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1

networks:
  as5-internet:
    external: true
  internet-backbone:
    external: true
  site-secondaire:
    external: true

