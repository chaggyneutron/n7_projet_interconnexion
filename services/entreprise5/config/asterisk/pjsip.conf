; PJSIP configuration for Asterisk — basic endpoints for 1001/1002
; This file ensures Asterisk listens on UDP 5060 via PJSIP and defines two endpoints

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; -------------------------
; Endpoint 1001
; -------------------------
[1001_auth]
type=auth
auth_type=userpass
username=1001
password=1001pass

[1001_aor]
type=aor
max_contacts=1

[1001]
type=endpoint
context=internal
disallow=all
allow=ulaw
allow=alaw
auth=1001_auth
aors=1001_aor
direct_media=no
rtp_symmetric=yes
rewrite_contact=yes

; -------------------------
; Endpoint 1002
; -------------------------
[1002_auth]
type=auth
auth_type=userpass
username=1002
password=1002pass

[1002_aor]
type=aor
max_contacts=1

[1002]
type=endpoint
context=internal
disallow=all
allow=ulaw
allow=alaw
auth=1002_auth
aors=1002_aor
direct_media=no
rtp_symmetric=yes
rewrite_contact=yes

; Optional: configure registration and other behaviors as needed
