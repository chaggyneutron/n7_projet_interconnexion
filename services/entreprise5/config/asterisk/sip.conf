
; NOTE: Asterisk 18 uses PJSIP (pjsip.conf) by default. This sip.conf file
; is left minimal to avoid conflicts with the PJSIP transport which binds
; UDP 5060. If you need legacy chan_sip only for some endpoints, define
; them in a separate file and ensure they bind to a different port.
;
; Bind chan_sip to loopback only to avoid port conflicts with PJSIP
[general]
udpbindaddr = 127.0.0.1:5061
tcpenable = no
srvlookup = yes
qualify = yes
nat = force_rport,comedia
directmedia = no
disallow = all
allow = ulaw
allow = alaw

; No chan_sip endpoints are defined here to avoid duplication with pjsip.conf
; If necessary, add chan_sip endpoints here and set their host/type/secret.

