# Configuration DHCP pour le réseau Entreprise
# Réseau: 120.0.84.0/24
# Serveur: dhcp-entreprise5 (120.0.84.15)

# Options globales
option domain-name "entreprise5.lan";
option domain-name-servers 120.0.84.10, 120.0.85.10;
option routers 120.0.84.1;
option subnet-mask 255.255.255.0;
option broadcast-address 120.0.84.255;

# Plage d'adresses DHCP
subnet 120.0.84.0 netmask 255.255.255.0 {
    range 120.0.84.100 120.0.84.200;
    option routers 120.0.84.1;
    option domain-name-servers 120.0.84.10, 120.0.85.10;
    option domain-name "entreprise5.lan";
    default-lease-time 3600;
    max-lease-time 7200;
}

