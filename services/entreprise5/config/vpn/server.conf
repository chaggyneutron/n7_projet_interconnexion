# Configuration OpenVPN Serveur - Site Principal Entreprise 5
port 1194
proto udp
dev tun0

# Certificats et clés
ca /etc/openvpn/ca.crt
cert /etc/openvpn/server.crt
key /etc/openvpn/server.key
dh /etc/openvpn/dh.pem

# Réseau VPN
server 10.8.0.0 255.255.255.0

# Routes pour le réseau entreprise
push "route 120.0.84.0 255.255.255.0"
push "route 120.0.80.0 255.255.240.0"

# DNS
push "dhcp-option DNS 120.0.84.10"
push "dhcp-option DOMAIN entreprise5.lan"

# Sécurité
cipher AES-256-CBC
auth SHA256
tls-auth /etc/openvpn/ta.key 0
key-direction 0

# Compression
comp-lzo

# Logs
verb 3
mute 20

# Persistance
persist-key
persist-tun

# Utilisateurs
user nobody
group nogroup

# Redirection de trafic (optionnel)
# push "redirect-gateway def1 bypass-dhcp"

