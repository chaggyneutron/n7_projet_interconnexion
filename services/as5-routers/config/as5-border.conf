frr version 9.1
frr defaults traditional
hostname as5-border
log syslog informational
service integrated-vtysh-config
!
! Interface vers backbone AS5
interface eth0
 ip address 120.0.80.1/24
 ip ospf network point-to-point
!
! Interface vers Internet/AS externe
interface eth1
 ip address 120.0.81.1/24
 ip ospf network point-to-point
!
! Interface vers entreprise
interface eth2
 ip address 120.0.82.1/24
 ip ospf network point-to-point
!
! Interface vers particulier
interface eth3
 ip address 120.0.83.1/24
 ip ospf network point-to-point
!
! OSPF Configuration
router ospf
 ospf router-id 120.0.80.1
 network 120.0.80.0/24 area 0
 network 120.0.81.0/24 area 0
 network 120.0.82.0/24 area 0
 network 120.0.83.0/24 area 0
 redistribute connected
!
! BGP Configuration
router bgp 5
 bgp router-id 120.0.80.1
 no bgp default ipv4-unicast
 neighbor 120.0.81.2 remote-as 1
 neighbor 120.0.81.2 description Internet Router (AS1)
 neighbor 120.0.80.2 remote-as 5
 neighbor 120.0.80.2 description AS5 Internal Router
 !
 address-family ipv4
  network 120.0.80.0/24
  network 120.0.82.0/24
  network 120.0.83.0/24
  neighbor 120.0.81.2 activate
  neighbor 120.0.80.2 activate
  neighbor 120.0.80.2 next-hop-self
 exit-address-family
!
line vty
!

