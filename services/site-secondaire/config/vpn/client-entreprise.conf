# Configuration OpenVPN Client - Site Secondaire vers Site Principal
client
dev tun0
proto udp
# Connexion directe à l'IP du serveur VPN entreprise
remote 120.0.84.14 1194
keepalive 10 60
resolv-retry infinite
nobind
persist-key
persist-tun

# Certificats et clés
ca /etc/openvpn/ca.crt
cert /etc/openvpn/client-site-secondaire.crt
key /etc/openvpn/client-site-secondaire.key
tls-auth /etc/openvpn/ta.key 1
key-direction 1

# Sécurité
cipher AES-256-CBC
auth SHA256

# Compression
comp-lzo

# Logs
verb 3
mute 20

