# Configuration OpenVPN Serveur - Site Secondaire
port 1194
proto udp
dev tun0

# Certificats et clés
ca /etc/openvpn/ca.crt
cert /etc/openvpn/server.crt
key /etc/openvpn/server.key
dh /etc/openvpn/dh.pem

# Réseau VPN
server 10.9.0.0 255.255.255.0

# Routes pour le réseau site secondaire
push "route 10.0.2.0 255.255.255.0"

# Routes pour le réseau entreprise (site principal)
push "route 120.0.84.0 255.255.255.0"

# DNS
push "dhcp-option DNS 8.8.8.8"

# Sécurité
cipher AES-256-CBC
auth SHA256
tls-auth /etc/openvpn/ta.key 0
key-direction 0

# Compression
comp-lzo

# Logs
verb 3
mute 20

# Persistance
persist-key
persist-tun

# Utilisateurs
user nobody
group nogroup

