frr version 9.1
frr defaults traditional
hostname internet-router
log syslog informational
service integrated-vtysh-config
!
! Interface vers AS5
interface eth0
 ip address 120.0.81.2/24
!
! Interface vers backbone Internet
interface eth1
 ip address 10.0.0.1/24
!
! Interface vers site secondaire
interface eth2
 ip address 10.0.1.1/24
!
! BGP Configuration
router bgp 1
 bgp router-id 10.0.0.1
 no bgp default ipv4-unicast
 neighbor 120.0.81.1 remote-as 5
 neighbor 120.0.81.1 description AS5 Border Router
 !
 address-family ipv4
  network 10.0.0.0/24
  network 10.0.1.0/24
  neighbor 120.0.81.1 activate
 exit-address-family
!
line vty
!

