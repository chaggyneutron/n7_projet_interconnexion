// Configuration DNS autoritaire pour entreprise5.lan
options {
    directory "/var/cache/bind";
    recursion yes;
    allow-recursion { 120.0.84.0/24; };
    listen-on port 53 { 120.0.84.10; any; };
    listen-on-v6 { none; };
    forwarders {
        120.0.85.10;  // DNS AS5
    };
    dnssec-validation auto;
    auth-nxdomain no;
};

// Zone autoritaire pour entreprise5.lan
zone "entreprise5.lan" {
    type master;
    file "/etc/bind/db.entreprise5.lan";
    allow-update { none; };
};

// Zone reverse
zone "84.0.120.in-addr.arpa" {
    type master;
    file "/etc/bind/db.84.0.120";
    allow-update { none; };
};

logging {
    channel default_log {
        file "/var/log/named.log" versions 3 size 5m;
        severity dynamic;
        print-time yes;
    };
    category default { default_log; };
    category queries { default_log; };
};

