[general]
context = default
allowguest = no
allowoverlap = no
udpbindaddr = 0.0.0.0:5060
tcpenable = no
tcpbindaddr = 0.0.0.0:5060
transport = udp
srvlookup = yes
qualify = yes
nat = force_rport,comedia
directmedia = no
disallow = all
allow = ulaw
allow = alaw
allow = gsm
allow = g729

[1001]
type = friend
host = dynamic
secret = 1001pass
context = internal
canreinvite = no
dtmfmode = rfc2833
mailbox = 1001@default

[1002]
type = friend
host = dynamic
secret = 1002pass
context = internal
canreinvite = no
